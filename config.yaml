inputs:
  # Manhole to delineate — use FACILITYID (preferred) OR coordinate, not both
  manhole_id: "17506"          # FACILITYID from manholes shapefile (Tract 18.02 sample site; 18177 was a headwater with no upstream)
  manhole_coordinate: null     # [x, y] in EPSG:2264 feet — used only if manhole_id is null

  gravity_main_shapefile: "data/gravity_mains.shp"
  manholes_shapefile: "data/manholes.shp"
  population_units_shapefile: "data/nc_the city_parcels_poly.shp"
  population_units_crs: "EPSG:2264"   # parcels missing CRS in file — assigned on load

  # Census blocks — alternate population/boundary unit (statewide NC TIGER 2020).
  # Ships a .prj (EPSG:4269 geographic); reprojected to `crs` and filtered to
  # census_blocks_county_fips on load. Only needed for block/hybrid methods.
  census_blocks_shapefile: "data/the city Blocks/tl_2021_37_tabblock20.shp"
  census_blocks_crs: "EPSG:4269"      # TIGER files are NAD83 geographic
  census_blocks_county_fips: "063"    # the city County — filter COUNTYFP20 before use

  # Validation set (lives in the sibling CommunityWastewaterDashboard project).
  # Only read by src/validation.py --sweep; not required for a normal run.
  validation_truth_polygons: "../CommunityWastewaterDashboard/data/raw/shapefiles/Sampling_Polygons_07062026.shp"
  validation_points: "../CommunityWastewaterDashboard/data/raw/shapefiles/Sampling_Locations_05212026.shp"

  # Human QA review decisions (see src/qa_review.py). Rows with decision=snap
  # force node merges in the shared snap (pass 3); resolved/keep rows annotate
  # flags so reviewed items stop appearing as open. Optional — remove or leave
  # the file absent to run without prior review.
  qa_review_decisions: "QC/qa_review_decisions.csv"

parameters:
  crs: "EPSG:2264"                  # NAD83 / NC State Plane, US survey feet
  node_snap_tolerance_ft: 1.0       # endpoints within this distance merged into one node
  snap_gap_search_radius_ft: 10.0   # search radius for near-miss end node pairs (snap gap QC flags)
  manhole_snap_distance_ft: 50.0    # max distance to snap coordinate input to graph node
  manhole_node_snap_ft: 5.0         # max distance to match a manhole to a pipe endpoint by coordinate
  review_match_radius_ft: 50.0      # proximity fallback for matching review decisions to flags whose id shifted (e.g. component numbering)
  pipe_buffer_distance_ft: 50.0     # thin QC ribbon for low_population_match coverage check
  selection_radius_ft: 50.0         # buffer around pipes for population-unit selection (swept in validation)

  # Midspan-junction splits (2026-07-03): T-junctions digitized without splitting
  # the receiving main (lateral endpoint and/or manhole on a pipe's interior) are
  # split in memory at load time so the network traces through them. The source
  # layer is untouched; each junction gets a midspan_junction QA flag for the
  # maintainer. See src/pipe_splits.py.
  split_midspan_junctions: true
  midspan_interior_tol_ft: 2.0        # how close to a pipe's interior counts as "on the pipe"
  midspan_endpoint_exclusion_ft: 10.0 # junctions this close to the pipe's own endpoints belong to the snap/snap_gap machinery, not a split

  # Human-directed pipe edits (flip/delete/extend) from the QA review decisions
  # file (src/pipe_edits.py). Applied in memory at load time, source layer
  # untouched; each emits a manual_edit QA flag for the maintainer.
  apply_pipe_edits: true
  pipe_edit_locate_tol_ft: 50.0       # max distance from an edit's x/y locator to the pipe it edits

  # Competing-pipe check (QC round 1 item 2): flag served parcels that a
  # DIFFERENT network's main also claims. review_required when a foreign pipe
  # crosses the parcel or is closer than the in-trace pipe; warning when a
  # foreign pipe is merely within the selection radius. Flag-only — nothing is
  # excluded until Grace has reviewed a batch (decision_log 2026-07-02).
  competing_pipe_check: true

  # Boundary construction (Phase 8). `boundary_method` picks how the served units
  # become a seamless polygon; morph_close is the tuned primary method.
  boundary_method: "morph_close"    # morph_close | blocks_dissolve | hybrid | concave
  close_radius_ft: 150.0            # morphological close radius (buffer +r then -r); re-swept 2026-07-02 vs corrected truth (was 100)
  concave_ratio: 0.3               # shapely.concave_hull ratio knob (0=tight, 1=convex); concave method only

  large_catchment_threshold_acres: 500.0
  flag_map_context_buffer_ft: 1000.0  # zoom context around each flag in PDF maps

  # low_population_match fires when less than this fraction of the pipe buffer
  # overlaps any served parcel (scale-invariant; a low value = pipes running
  # through unparcelled ground). UNTUNED — no validation set; adjust if it
  # mis-fires on legitimate catchments.
  low_population_match_min_buffer_coverage: 0.5

  # Cyclic tangles (strongly-connected components) with this many manholes or
  # fewer are treated as local flips and get a normal map page. Larger ones are
  # sprawling logical loops — reported as a `large_cycle` flag with a suspect CSV
  # instead of a (useless, citywide) map.
  max_mappable_cycle_nodes: 10

  # Weakly-connected components with this many nodes or fewer are flagged as
  # disconnected fragments. Larger ones are separate drainage basins (the city's
  # network has several thousand-node components), not errors. Matches the
  # < 50 node criterion in check_sample_sites.py.
  disconnected_component_max_nodes: 50

  # Competing-pipe check: ignore foreign pipes that live in an isolated weak
  # component of this many pipes or fewer (a small dangling network — a 1-3 pipe
  # stub crossing a parcel is noise, not a rival network). The pipes stay in the
  # graph and are still traced; they're only dropped from the competing foreign
  # set. Counts edges, so 3 catches 1-, 2-, and 3-pipe components.
  competing_ignore_dangling_max_pipes: 3

  # Explode multipart population units into single-part rows at load, so each
  # part is selected/contested on its own (one part touching a foreign main no
  # longer flags the whole record; parts beyond the selection radius drop out).
  explode_multipart_units: true

  # Equidistant split of border units that BOTH an in-trace and a foreign pipe
  # cross (cp_pos=border, cp_cross=1, cp_din=0): keep only the sub-area closer to
  # the in-trace network (Voronoi cut along the equidistant line). Border units a
  # foreign pipe crosses but no in-trace pipe does (cp_din>0) are fully excluded
  # instead (cp_excl); inner units are never split.
  split_border_contested: true
  split_near_radius_ft: 100.0     # pipes within this of a unit feed its split
  split_densify_step_ft: 3.0      # point spacing along pipes for the Voronoi cut

  # Which flag types get individual PDF map pages. All flags always appear in the
  # CSV; this only controls the maps. Bulk completeness issues (isolated_manhole,
  # disconnected_component) are left CSV-only by default — they read fine as rows
  # and would otherwise dominate the PDF.
  # missing_direction is deliberately NOT mapped: those pipes get direction from
  # geometry (direction_inferrable) and need no human review — CSV/GPKG only.
  pdf_flag_types:
    - invert_conflict
    - snap_gap
    - attribute_slope_error   # emitted name (was listed as negative_slope, which no check emits)
    - directed_cycle
    - midspan_junction        # T-junction auto-split in memory; source layer needs a real split
    - manual_edit             # reviewer-directed flip/delete/extend applied in memory

  # Basemap under PDF maps. Plot is reprojected to EPSG:3857 for tile display only
  # (data on disk stays in `crs`). Requires internet at map time; degrades
  # gracefully (skips basemap + warns) when offline.
  basemap_style: "satellite"        # satellite (Esri World Imagery) | street (CartoDB Positron)

  # IoU-floor success thresholds (Phase 8 validation). Set 2026-07-02 per the
  # roadmap recommendation after the first sweep showed morph_close at median
  # 0.79, 20/21 aggregate sites >= 0.5.
  iou_floor_median: 0.75            # T1 — winner must have median IoU >= this
  iou_floor_n_sites: 20             # N  — winner needs >= N of the ~21 aggregate sites at IoU >= 0.5
                                    #      (aggregate excludes 30804 pumped + 02201/03442 undiagnosed)

outputs:
  node_layer: "output/pipe_endpoint_nodes.gpkg"
  snap_gap_pairs: "output/snap_gap_pairs.gpkg"
  end_nodes: "output/end_nodes.gpkg"
  output_polygon: "output/sewershed.shp"
  flags_report: "output/flags.csv"
  flag_maps_pdf: "output/flag_maps.pdf"
  large_cycle_suspects: "output/large_cycle_suspects.csv"
  debug_upstream_pipes: "output/debug_upstream_pipes.shp"

  # Phase 8 outputs
  sewershed_parcels: "output/sewershed_parcels.shp"    # raw served-unit union (intermediate, inspectable)
  sewershed_boundary: "output/sewershed_boundary.shp"  # final seamless boundary (scored)
  validation_overlay: "output/validation_overlay.gpkg" # truth vs generated, per-site IoU
  qc_flags_gpkg: "output/qc_flags.gpkg"                # network + delineation flags as spatial layers

  # Competing-pipe review batch (run_competing_review.py) — Grace fills the
  # CSV's decision column; a later pass consumes it (qa_review pattern).
  competing_review_csv: "QC/competing_pipe_review.csv"
  competing_review_gpkg: "QC/competing_pipe_review.gpkg"
