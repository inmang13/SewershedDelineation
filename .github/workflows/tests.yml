name: tests

# Runs the synthetic pytest suite on every push and pull request. The suite is
# data-independent (toy geometry only) so it passes on a clean checkout with no
# data/ directory. The geospatial stack (geopandas/shapely/pyogrio/scipy) is the
# most likely point of install failure; if wheels lag on a new Python, pin the
# matrix version below to a supported one.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v
